<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee List</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<!-- Add button here -->
<div class="mb-3">
    <a th:href="@{/dodos/addEmployee}" class="btn btn-primary">Add Employee</a>
</div>
<h1>Employee List</h1>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}">ID</td>
        <td th:text="${employee.firstName}">First Name</td>
        <td th:text="${employee.lastName}">Last Name</td>
        <td th:text="${employee.email}">Email</td>
        <td>

            <form th:action="@{/dodos/deleteEmployee}"  method="post">
                <input type="hidden" name="id" th:value="${employee.id}" />
                <input type="hidden" name="firstName" th:value="${employee.firstName}" />
                <input type="hidden" name="lastName" th:value="${employee.lastName}" />
                <input type="hidden" name="email" th:value="${employee.email}" />
                <button type="submit">Delete</button>
            </form>

        </td>

    </tr>
    </tbody>
</table>
</body>
</html>
