<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Form</title>
</head>
<body>
<form th:action="@{/customerWelcome}"th:object="${customer}" method="POST" >
    First Name :<input type="text" th:field="*{fname}" placeholder="Enter your name" />
    <br>
    Last Name  :<input type="text" th:field="*{lname}" placeholder="Enter your last name" />
    <br>
    <input type="submit" value="Submit" />
</form>

</body>
</html>
